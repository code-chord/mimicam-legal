<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pipopi - しょうたい</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #FDFDF8; color: #1A1A1A;
    display: flex; align-items: center; justify-content: center; }
  .card { text-align: center; padding: 32px 28px; max-width: 340px; }
  .logo { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .logo .dot { color: #5FE6A3; }
  p { line-height: 1.7; color: #4A4A44; }
  .btn { display: inline-block; margin-top: 20px; padding: 14px 28px;
    background: #5FE6A3; color: #1A1A1A; font-weight: 700; text-decoration: none;
    border: 2.5px solid #1A1A1A; }
  .sub { font-size: 12px; color: #8A8A82; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">pipo<span class="dot">・</span>pi</div>
    <p id="msg">ぴぽぴを ひらいています…</p>
    <a id="storeLink" class="btn" href="https://apps.apple.com/app/id6784951197">
      App Storeで ひらく
    </a>
    <p class="sub">アプリが なければ、App Storeに とびます</p>
  </div>
<script>
  // URL の ?code=XXXX を、アプリ用のカスタムスキームに引き継ぐ。
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const appUrl = code
    ? 'pipopi://join?code=' + encodeURIComponent(code)
    : 'pipopi://';
  document.getElementById('storeLink').href = 'https://apps.apple.com/app/id6784951197';

  // アプリが入っていれば開く。入っていなければ何も起きないので、
  // 少し待ってから自動で App Store に切り替える（スマホのSafariのみ想定）。
  window.location.href = appUrl;
  setTimeout(function () {
    document.getElementById('msg').textContent = 'アプリが みつかりませんでした';
    window.location.href = 'https://apps.apple.com/app/id6784951197';
  }, 1500);
</script>
</body>
</html>
