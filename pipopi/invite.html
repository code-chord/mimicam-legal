<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pipopi - しょうたい</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #FDFDF8; color: #1A1A1A;
    display: flex; align-items: center; justify-content: center; }
  .card { text-align: center; padding: 32px 28px; max-width: 340px; }
  .logo { width: 200px; max-width: 70%; height: auto; margin-bottom: 12px; }
  p { line-height: 1.7; color: #4A4A44; }
  .btn { display: block; margin-top: 16px; padding: 16px 20px;
    background: #5FE6A3; color: #1A1A1A; font-weight: 700; text-decoration: none;
    border: 2.5px solid #1A1A1A; font-size: 17px; }
  .btn.sub-btn { background: #FFFFFF; font-weight: 400; font-size: 15px; }
  .sub { font-size: 12px; color: #8A8A82; margin-top: 22px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./logo.png" alt="pipopi">
    <p id="msg">なかまに しょうたいされました！</p>

    <a id="storeLink" class="btn" href="https://apps.apple.com/jp/app/id6784951197">
      App Storeで ダウンロード
    </a>
    <a id="appLink" class="btn sub-btn" href="#">
      アプリを もっている ひとは こちら
    </a>

    <p class="sub" id="hint">
      アプリを いれてから、もういちど このリンクを ひらいてね
    </p>
  </div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var appUrl = code
    ? 'pipopi://join?code=' + encodeURIComponent(code)
    : 'pipopi://';
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  var isAndroid = /Android/.test(ua);

  // 端末に合わせてストアを出し分ける（Android版は公開後に有効になる）。
  var storeUrl = isAndroid
    ? 'https://play.google.com/store/apps/details?id=com.pipopi.pipopi'
    : 'https://apps.apple.com/jp/app/id6784951197';

  document.getElementById('appLink').href = appUrl;
  var storeLink = document.getElementById('storeLink');
  storeLink.href = storeUrl;
  if (isAndroid) storeLink.textContent = 'Google Play で ダウンロード';
  // LINE / Instagram / Facebook などのアプリ内ブラウザではカスタムスキームが
  // 使えないことが多いので、自動起動は試さずボタンだけ見せる。
  var inAppBrowser = /Line|Instagram|FBAN|FBAV|Twitter/i.test(ua);

  if ((!isIOS && !isAndroid) || inAppBrowser) return;

  // 見えない iframe で開くと、アプリが無い時にエラーダイアログが出ない。
  var tried = false;
  function tryOpenApp() {
    if (tried) return;
    tried = true;
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = appUrl;
    document.body.appendChild(iframe);
    setTimeout(function () {
      try { document.body.removeChild(iframe); } catch (e) {}
    }, 1200);
  }
  tryOpenApp();
})();
</script>
</body>
</html>
